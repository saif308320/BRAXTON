<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO confirmed — Braxton</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar"><div class="shell"><span>Fulfillment</span><span>Chicago</span></div></div>
  <header class="bx">
    <a class="wordmark" href="index.html">BRAXTON <span>BUSINESS SYSTEMS</span></a>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="product.html">EliteBook 13</a>
      <a href="about.html">About</a>
      <a href="support.html">Support</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="tools">
      <button class="req" data-bag>Requisition <span data-count>0</span></button>
      <button class="menu" id="menu">☰</button>
    </div>
  </header>
  <div class="shell" style="text-align:center;padding:72px 0 100px">
    <div class="k">Purchase order</div>
    <h1 style="font-size:40px;margin:10px 0">Acknowledged.</h1>
    <p id="oid" style="letter-spacing:0.16em"></p>
    <div id="items" style="max-width:440px;margin:20px auto;text-align:left"></div>
    <a class="gold" href="index.html">Return to overview</a>
  </div>
  <footer class="bx"><div class="shell"><p>700 Corporate Parkway, Chicago, IL 60601 · sales@braxtonelite.com · +1 312 555 0154</p></div></footer>
  <div class="shade" id="shade"></div>
  <aside class="drawer" id="drawer">
    <div class="dh"><strong>Requisition</strong><button class="out" style="color:var(--navy);border-color:var(--line)" id="dclose">Close</button></div>
    <div class="db" id="db"></div>
    <div class="df"><span id="dt">$0</span><a class="gold" href="cart.html">Review</a></div>
  </aside>
  <script src="js/app.js"></script>
  <script>
    const o=JSON.parse(sessionStorage.getItem("braxton_order")||"null");
    if(!o) location.href="shop.html";
    else {
      document.getElementById("oid").textContent=o.id;
      document.getElementById("items").innerHTML=o.items.map(i=>`<p>${i.name} — ${i.config} · ${BX.money(i.price*i.qty)}</p>`).join("")+`<p><strong>Paid ${BX.money(o.total)}</strong></p>`;
    }
  </script>
</body>
</html>
